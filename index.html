<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>
    
    
    <h1>Cadastro de Usuário</h1>

<form>

    <label>Nome Completo:</label><br>
    <input type="text" required><br><br>


    <label>Data de Nascimento:</label><br>
    <input type="date" required><br><br>



    <label>CPF:</label><br>
    <input type="text" maxlength="11" placeholder="Apenas números (11 dígitos)" required><br><br>



    <label>Gênero:</label><br>
    <select required>
        <option value="">Selecione...</option>
        <option>Masculino</option>
        <option>Feminino</option>
        <option>Outro</option>
    </select><br><br>


    <label>Telefone:</label><br>
    <input type="tel" placeholder="(XX) XXXXX-XXXX" required><br><br>



    <label>E-mail:</label><br>
    <input type="email" required><br><br>


    <label>Cidade:</label><br>
    <input type="text" required><br><br>


    <label>UF:</label><br>
    <select required>
        <option value="">Selecione...</option>
        <option>AC</option>
        <option>AL</option>
        <option>AP</option>
        <option>AM</option>
        <option>BA</option>
        <option>CE</option>
        <option>DF</option>
        <option>ES</option>
        <option>GO</option>
        <option>MA</option>
        <option>MG</option>
        <option>PA</option>
        <option>PB</option>
        <option>PR</option>
        <option>PE</option>
        <option>PI</option>
        <option>RJ</option>
        <option>RN</option>
        <option>RS</option>
        <option>RO</option>
        <option>RR</option>
        <option>SC</option>
        <option>SP</option>
        <option>SE</option>
        <option>TO</option>
    </select><br><br>

      <button type="submit">Cadastrar</button>

</form>


<h1>O SENAI AGRADECE SUA INSCRIÇÃO!!!</h1>

<button onclick="location.href='cadastro.html'">
Voltar
</button>

</body>
</html>
